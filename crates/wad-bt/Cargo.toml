[package]
name = "wad-bt"
description = "Bluetooth for wadd through BlueZ over D-Bus: power, looking for devices, pairing (with an agent of its own whose prompts wadd answers), connecting, disconnecting, forgetting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A fake BlueZ on a bus the test gives (wad-net's private one), for wad-bt's
# tests and wadd's.
fake = []

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wad-proto.workspace = true
zbus.workspace = true

[dev-dependencies]
wad-bt = { path = ".", features = ["fake"] }
wad-net = { workspace = true, features = ["fake"] }
