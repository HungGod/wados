[package]
name = "wad-tailscale"
description = "tailscaled for wadd: its LocalAPI (status, whois, prefs, the IPN bus) over its Unix socket, and the tailscale CLI (up, logout, set, Taildrive as the person)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A fake tailscaled (its LocalAPI on a Unix socket, over a tailnet the test
# describes) and the fixtures, for wadd's tests and the harness's.
fake = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
