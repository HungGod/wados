[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# C, built by images/builder (not a Cargo package).
exclude = ["apps/selkies-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
wad-model = { path = "crates/wad-model" }
wad-gen = { path = "crates/wad-gen" }
wad-wayland = { path = "crates/wad-wayland" }
wad-gtk = { path = "crates/wad-gtk" }
wad-config = { path = "crates/wad-config" }
wad-proto = { path = "crates/wad-proto" }
wad-wadd-client = { path = "crates/wad-wadd-client" }
wad-podman = { path = "crates/wad-podman" }
wad-systemd = { path = "crates/wad-systemd" }
wad-tailscale = { path = "crates/wad-tailscale" }
wad-github = { path = "crates/wad-github" }
wad-git = { path = "crates/wad-git" }
wad-cloudflare = { path = "crates/wad-cloudflare" }
wad-net = { path = "crates/wad-net" }
wad-bt = { path = "crates/wad-bt" }
wad-desk = { path = "crates/wad-desk" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
toml = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
# A mock GitHub for wad-github's and wadd's tests (never the real one).
wiremock = "0.6"
async-channel = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.31", features = ["user", "fs", "ioctl", "poll", "hostname", "term"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
gdk4-wayland = { version = "0.11", features = ["v4_20"] }
# GApplicationCommandLine's print_literal (GLib 2.80; Fedora 44 has 2.86): WadBrowser
# answers a launch that handed its arguments over.
gio = { version = "0.22", features = ["v2_80"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }

# WadBrowser (the Cactus fork, MPL-2.0: crates/wadbrowser-*, apps/wadbrowser).
wadbrowser-core = { path = "crates/wadbrowser-core" }
wadbrowser-privacy = { path = "crates/wadbrowser-privacy" }
wadbrowser-webkit = { path = "crates/wadbrowser-webkit" }
wadbrowser-ui = { path = "crates/wadbrowser-ui" }
# WebKitGTK 2.52+ and libadwaita 1.9+: Fedora 44 has 2.54 and 1.9.4.
webkit6 = { version = "0.6.1", features = ["v2_52"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# content-blocking: FilterSet::into_content_blocking, EasyList as WebKit
# content-filter (Apple) rules.
adblock = { version = "0.13", features = ["content-blocking"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
anyhow = "1"
# The share sheet's QR code (its modules only: the shell draws them).
qrcode = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Dev builds and tests: line numbers for backtraces, no other debug info
# (dependencies get none), so test binaries stay small enough to link several
# at once on a laptop. For a debugger, CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# The binaries that go into the wadspace base image (WadBrowser, the
# clipboard bridge, wadspaces-session): fast to start, small.
[profile.image]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
