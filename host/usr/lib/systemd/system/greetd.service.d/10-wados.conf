# WadOS: greetd logs the machine's person (uid 1000) straight into the
# session (/usr/libexec/wados/session: labwc and the shell, which locks
# first). The config is written for each start, since only then is the
# person's name known (/usr/libexec/wados/greetd-config); with no uid 1000
# it's the login prompt on tty1.
[Unit]
After=wadd.socket

[Service]
ExecStartPre=/usr/libexec/wados/greetd-config
ExecStart=
ExecStart=/usr/bin/greetd --config /run/wados/greetd.toml
