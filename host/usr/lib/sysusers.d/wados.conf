# WadOS's users and groups. The machine's person (uid 1000) is made by the
# installer (phase 9), in wados and wheel; there's no kiosk or admin user.

# Who may use wadd's API (wadd.socket's group; wad-config's allow_groups).
g wados -

# Who wadspaces' clipboard bridges run as (wadd starts one per wadspace on
# the screen, with its connections already made: apps/wadd/src/clip.rs):
# never root, never the person. Locked: nobody logs in as it.
u! wadspaces-clip - "WadSpaces clipboard bridges" / /usr/sbin/nologin
