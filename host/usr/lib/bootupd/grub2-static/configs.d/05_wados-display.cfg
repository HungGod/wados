# WadOS: Linux starts in the screen's own resolution. Until a machine has its
# graphics drivers (early boot, the installer stick), everything draws on
# the framebuffer the firmware leaves, and firmware often leaves a low 4:3
# mode the monitor then stretches. GRUB sets the best mode the card and the
# screen offer before starting Linux instead. With drivers, they set the
# mode themselves.
if [ "${grub_platform}" = "efi" ]; then
  insmod efi_gop
  set gfxpayload=auto
fi
