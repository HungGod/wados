# WadOS's folders. wadd's (wad-config's [daemon], profile System):
#   state_dir    /var/lib/wados           the library, root's alone
#   signins_dir  /var/lib/wados/keys      a folder per key (wadd makes each,
#                                         uid 1000's: abc's in the wadspaces)
#   projects_dir /var/lib/wados/projects  a folder per project (phase 6)
#   units_dir    /run/containers/systemd  the wadspaces' quadlet units,
#                                         written at every start (so never
#                                         stale, and gone after a rollback)
#   screen_dir   /run/wados/screen        wadd.service's RuntimeDirectory
d /var/lib/wados 0700 root root -
d /var/lib/wados/keys 0700 root root -
d /var/lib/wados/projects 0700 root root -
d /run/containers/systemd 0755 root root -
# greetd's config for this start (/usr/libexec/wados/greetd-config).
d /run/wados 0755 root root -
# The machine's own settings: the installer's provision writes wadd.toml and
# turn.toml here (phase 9).
d /etc/wados 0755 root root -
# The Cloudflare tunnel's token (/etc/cloudflared/token, cloudflared.service):
# root's alone. wadd.service may write it, so the folder must be there.
d /etc/cloudflared 0700 root root -
# tailscaled's state (the machine's key and its tailnet login) and cache:
# root's alone. tailscaled.service makes the first too; here so bootc knows
# what's in /var.
d /var/lib/tailscale 0700 root root -
d /var/cache/tailscale 0750 root root -
