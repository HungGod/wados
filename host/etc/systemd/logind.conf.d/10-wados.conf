# WadOS: the power key is the shell's. labwc's keybind (XF86PowerOff, in
# /etc/xdg/labwc/rc.xml) runs `wadsctl power`, the shell's power menu: Lock,
# Restart and Power off (on the lock screen, its Power off). So logind leaves
# the key alone rather than powering off at a touch.
#
# The rest is logind's default: the lid and the suspend key suspend, and the
# shell locks the screen first (a sleep delay inhibitor, let go at
# PrepareForSleep once the lock shows).
[Login]
HandlePowerKey=ignore
