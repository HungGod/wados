[package]
name = "wadd"
description = "The WadSpaces machine daemon: the machine's wadspaces (their documents, images and runs), over /run/wadd/wadd.sock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
# The streaming proxy (proxy.rs): v1's hyper plumbing, WebSockets passed through.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
indexmap.workspace = true
libc.workspace = true
nix.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
# turn.rs: the machine's TURN key (/etc/wados/turn.toml).
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wad-bt.workspace = true
wad-config.workspace = true
wad-gen.workspace = true
wad-git.workspace = true
wad-github.workspace = true
wad-model.workspace = true
wad-net.workspace = true
wad-podman.workspace = true
wad-proto.workspace = true
wad-systemd.workspace = true
wad-tailscale.workspace = true
wad-wayland.workspace = true
# The network's and Bluetooth's errors (NetworkManager's and BlueZ's, over D-Bus).
zbus.workspace = true

[dev-dependencies]
# A fake NetworkManager and BlueZ on a private D-Bus, for the radios' tests.
wad-bt = { workspace = true, features = ["fake"] }
wad-net = { workspace = true, features = ["fake"] }
# A fake tailscaled and tailscale CLI for the tailnet's tests.
wad-tailscale = { workspace = true, features = ["fake"] }
tempfile.workspace = true
wad-wadd-client.workspace = true
url.workspace = true
wiremock.workspace = true
