# WadSpaces: every terminal runs in tmux (wadspaces-term), so its jobs carry
# on while the wadspace moves between the screen and a stream
# (wadspaces-session reopens its window). tmux stays out of sight: no status
# bar, no prefix key, the mouse scrolls, and what's selected is copied
# (OSC 52, through foot). A session ends with its window (its
# destroy-unattached, set by wadspaces-term), except during a move.
set -g status off
set -g prefix None
unbind-key C-b
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,foot*:clipboard"
# A shell started after a move sees where the desktop is now.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS PULSE_SERVER"
