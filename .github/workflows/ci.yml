# fmt, clippy and tests for the Rust workspace, and the site's build, on
# Fedora 44 (what the machine runs). Nothing here needs a secret.
name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Packages
        run: >
          dnf -y install git gcc pkgconf rustup
          gtk4-devel gtk4-layer-shell-devel libadwaita-devel webkitgtk6.0-devel
          pam-devel wayland-devel libxkbcommon-devel
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml's)
        run: |
          rustup-init -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
